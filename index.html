<style>
    body {
        margin: 0;
        padding: 0;
        /* 📱 배경 이미지 확장자를 .png로 수정했습니다 */
        background-image: url('bg.png'); 
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: 'Malgun Gothic', sans-serif;
        overflow: hidden;
        touch-action: none; 
    }
    #game-container {
        position: relative;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        border-radius: 12px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.9); 
        max-width: 100vw;
        max-height: 90vh;
    }
    #score-board {
        position: absolute;
        top: 15px;
        left: 15px;
        font-size: 20px;
        font-weight: bold;
        color: #333;
        z-index: 10;
        background: rgba(255,255,255,0.85);
        padding: 6px 14px;
        border-radius: 20px;
    }
    #next-preview {
        position: absolute;
        top: 15px;
        right: 15px;
        background: rgba(255,255,255,0.85);
        padding: 8px;
        border-radius: 12px;
        text-align: center;
        font-weight: bold;
        font-size: 12px;
        z-index: 10;
    }
    #next-image {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        margin-top: 5px;
        background-size: cover;
        background-position: center;
        border: 2px solid #ddd;
        display: inline-block;
    }
    #game-over {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.8);
        color: white;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 20;
    }
    #game-over h1 { font-size: 38px; margin-bottom: 10px; }
    #game-over button {
        padding: 12px 24px;
        font-size: 16px;
        cursor: pointer;
        background: #ff4757;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: bold;
    }
    #gameCanvas {
        display: block;
        max-width: 100%;
        height: auto;
    }
</style>
