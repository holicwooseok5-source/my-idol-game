<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이돌 얼굴 맞추기 게임</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Malgun Gothic', sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
        }
        #score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            z-index: 10;
            background: rgba(255,255,255,0.8);
            padding: 8px 16px;
            border-radius: 20px;
        }
        #next-preview {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.8);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            z-index: 10;
        }
        #next-image {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-top: 5px;
            background-size: cover;
            background-position: center;
            border: 2px solid #ddd;
            display: inline-block;
        }
        #game-over {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            color: white;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        #game-over h1 { font-size: 48px; margin-bottom: 10px; }
        #game-over button {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.2s;
        }
        #game-over button:hover { background: #ff6b81; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="score-board">SCORE: <span id="score">0</span></div>
    <div id="next-preview">
        NEXT<br>
        <div id="next-image"></div>
    </div>
    <div id="game-over">
        <h1>GAME OVER</h1>
        <p>최종 점수: <span id="final-score">0</span>점</p>
        <button onclick="resetGame()">다시 도전하기</button>
    </div>
    <canvas id="gameCanvas"></canvas>
</div>

<script>
// --- [내 컴퓨터 이미지 경로 설정 완교] ---
// 컴퓨터 사진 파일 이름들을 순서대로 미리 입력해 두었습니다.
const FACE_IMAGES = [
    "01.png", // 1단계 (가장 작은 얼굴)
    "02.png", // 2단계
    "03.png", // 3단계
    "04.png", // 4단계
    "05.png", // 5단계
    "06.png", // 6단계
    "07.png", // 7단계
    "08.png", // 8단계
    "09.png", // 9단계
    "10.png", // 10단계
    "11.png"  // 11단계 (가장 큰 얼굴 / 수박 역할)
];

// 각 단계별 크기(반지름) 설정
const LEVEL_SIZES = [20, 28, 36, 44, 52, 62, 72, 84, 96, 110, 125];

// 이미지 객체 미리 로드
const loadedImages = [];
FACE_IMAGES.forEach((src) => {
    const img = new Image();
    img.src = src;
    loadedImages.push(img);
});

// 엔진 설정 변수들
const { Engine, Render, Runner, Bodies, Composite, Body, Events } = Matter;
let engine, render, runner, canvas;
const width = 480;
const height = 700;
let score = 0;
let currentNextLevel = 0;
let canDrop = true;
let isGameOver = false;

function init() {
    canvas = document.getElementById("gameCanvas");
    canvas.width = width;
    canvas.height = height;

    engine = Engine.create({ gravity: { y: 1.2 } });
    
    // 벽면 생성
    const ground = Bodies.rectangle(width / 2, height + 30, width, 60, { isStatic: true, friction: 0.1 });
    const leftWall = Bodies.rectangle(-30, height / 2, 60, height, { isStatic: true, friction: 0.1 });
    const rightWall = Bodies.rectangle(width + 30, height / 2, 60, height, { isStatic: true, friction: 0.1 });
    Composite.add(engine.world, [ground, leftWall, rightWall]);

    // 다음 떨어질 레벨 결정
    currentNextLevel = Math.floor(Math.random() * 4);
    updateNextPreview();

    // 클릭 이벤트 등록
    canvas.addEventListener("click", handleCanvasClick);

    // 충돌 감지
    Events.on(engine, 'collisionStart', handleCollision);

    // 렌더링 루프
    requestAnimationFrame(renderLoop);
    
    // 엔진 구동
    runner = Runner.create();
    Runner.run(runner, engine);
}

function renderLoop() {
    if (isGameOver) return;

    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, width, height);

    // 제한선 그리기
    ctx.strokeStyle = "#ff4757";
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(0, 120);
    ctx.lineTo(width, 120);
    ctx.stroke();
    ctx.setLineDash([]);

    const bodies = Composite.allBodies(engine.world);
    
    bodies.forEach(body => {
        if (body.isStatic) return;

        const { x, y } = body.position;
        const radius = body.circleRadius;
        const level = body.gameLevel;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(body.angle);

        // 원형으로 사진 자르기
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();

        // 이미지 그리기
        const img = loadedImages[level];
        ctx.drawImage(img, -radius, -radius, radius * 2, radius * 2);

        ctx.strokeStyle = "rgba(0,0,0,0.1)";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.restore();

        // 게임오버 판단
        if (y - radius < 120 && body.velocity.y < 0.1 && !body.isNew) {
            triggerGameOver();
        }
    });

    requestAnimationFrame(renderLoop);
}

function handleCanvasClick(e) {
    if (!canDrop || isGameOver) return;
    canDrop = false;

    const rect = canvas.getBoundingClientRect();
    let clickX = e.clientX - rect.left;

    const currentRadius = LEVEL_SIZES[currentNextLevel];
    if (clickX < currentRadius) clickX = currentRadius;
    if (clickX > width - currentRadius) clickX = width - currentRadius;

    const ball = Bodies.circle(clickX, 60, currentRadius, {
        restitution: 0.2,
        friction: 0.1,
        density: 0.001
    });
    
    ball.gameLevel = currentNextLevel;
    ball.isNew = true;

    setTimeout(() => { ball.isNew = false; }, 1200);

    Composite.add(engine.world, ball);

    currentNextLevel = Math.floor(Math.random() * 4);
    updateNextPreview();

    setTimeout(() => { canDrop = true; }, 600);
}

function handleCollision(event) {
    const pairs = event.pairs;
    
    pairs.forEach(pair => {
        const bodyA = pair.bodyA;
        const bodyB = pair.bodyB;

        if (!bodyA.isStatic && !bodyB.isStatic && bodyA.gameLevel === bodyB.gameLevel) {
            const currentLevel = bodyA.gameLevel;
            
            if (currentLevel >= FACE_IMAGES.length - 1) return;

            const midX = (bodyA.position.x + bodyB.position.x) / 2;
            const midY = (bodyA.position.y + bodyB.position.y) / 2;

            Composite.remove(engine.world, [bodyA, bodyB]);

            score += (currentLevel + 1) * 10;
            document.getElementById("score").innerText = score;

            const nextLevel = currentLevel + 1;
            const newBall = Bodies.circle(midX, midY, LEVEL_SIZES[nextLevel], {
                restitution: 0.2,
                friction: 0.1
            });
            newBall.gameLevel = nextLevel;

            Composite.add(engine.world, newBall);
        }
    });
}

function updateNextPreview() {
    const nextImgDiv = document.getElementById("next-image");
    nextImgDiv.style.backgroundImage = `url('${FACE_IMAGES[currentNextLevel]}')`;
}

function triggerGameOver() {
    isGameOver = true;
    document.getElementById("final-score").innerText = score;
    document.getElementById("game-over").style.display = "flex";
    Runner.stop(runner);
}

function resetGame() {
    location.reload();
}

window.onload = init;
</script>

</body>
</html>
